<!DOCTYPE html>
<html>
<head>

    <title>Student Management System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        header {
            background: linear-gradient(135deg, #4f46e5, #7c3aed);
            color: white;
            padding: 25px;
            text-align: center;
        }

        header h1 {
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .cards {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            flex: 1;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .card h2 {
            color: #4f46e5;
            font-size: 32px;
            margin: 10px;
        }

        .form-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }

        .form-box h2 {
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }

        .add-btn {
            background: #4f46e5;
            color: white;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            padding: 8px 12px;
        }

        .search {
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        th {
            background: #4f46e5;
            color: white;
            padding: 15px;
        }

        td {
            padding: 13px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        tr:hover {
            background: #f8f8ff;
        }

        @media(max-width: 700px) {

            .cards {
                flex-direction: column;
            }

            table {
                font-size: 12px;
            }

        }

    </style>

</head>

<body>

<header>

    <h1>🎓 Student Management System</h1>
    <p>Manage Student Records Easily</p>

</header>


<div class="container">

    <div class="cards">

        <div class="card">
            <p>Total Students</p>
            <h2 id="totalStudents">0</h2>
        </div>

        <div class="card">
            <p>Average Marks</p>
            <h2 id="averageMarks">0</h2>
        </div>

        <div class="card">
            <p>Top Marks</p>
            <h2 id="topMarks">0</h2>
        </div>

    </div>


    <div class="form-box">

        <h2>➕ Add New Student</h2>

        <input
            type="text"
            id="studentId"
            placeholder="Student ID"
        >

        <input
            type="text"
            id="studentName"
            placeholder="Student Name"
        >

        <input
            type="number"
            id="studentAge"
            placeholder="Age"
        >

        <input
            type="text"
            id="studentCourse"
            placeholder="Course"
        >

        <input
            type="number"
            id="studentMarks"
            placeholder="Marks"
        >

        <button class="add-btn" onclick="addStudent()">
            Add Student
        </button>

    </div>


    <input
        class="search"
        type="text"
        id="search"
        placeholder="🔍 Search student..."
        onkeyup="displayStudents()"
    >


    <table>

        <thead>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Course</th>
                <th>Marks</th>
                <th>Grade</th>
                <th>Action</th>
            </tr>

        </thead>

        <tbody id="studentTable"></tbody>

    </table>

</div>


<script>

    let students = [];


    function addStudent() {

        let id =
            document.getElementById("studentId").value;

        let name =
            document.getElementById("studentName").value;

        let age =
            document.getElementById("studentAge").value;

        let course =
            document.getElementById("studentCourse").value;

        let marks =
            Number(document.getElementById("studentMarks").value);


        if (
            id === "" ||
            name === "" ||
            age === "" ||
            course === "" ||
            marks === ""
        ) {

            alert("Please fill all fields!");

            return;
        }


        let student = {

            id: id,
            name: name,
            age: age,
            course: course,
            marks: marks

        };


        students.push(student);


        clearForm();

        displayStudents();

    }


    function getGrade(marks) {

        if (marks >= 90)
            return "A+";

        if (marks >= 80)
            return "A";

        if (marks >= 70)
            return "B";

        if (marks >= 60)
            return "C";

        if (marks >= 50)
            return "D";

        return "F";

    }


    function displayStudents() {

        let table =
            document.getElementById("studentTable");

        let search =
            document.getElementById("search").value
            .toLowerCase();


        table.innerHTML = "";


        students.forEach((student, index) => {

            if (
                student.name.toLowerCase().includes(search) ||
                student.id.toLowerCase().includes(search)
            ) {

                let row = `

                <tr>

                    <td>${student.id}</td>

                    <td>${student.name}</td>

                    <td>${student.age}</td>

                    <td>${student.course}</td>

                    <td>${student.marks}</td>

                    <td>${getGrade(student.marks)}</td>

                    <td>
                        <button
                            class="delete-btn"
                            onclick="deleteStudent(${index})">
                            Delete
                        </button>
                    </td>

                </tr>

                `;

                table.innerHTML += row;

            }

        });


        updateStatistics();

    }


    function deleteStudent(index) {

        students.splice(index, 1);

        displayStudents();

    }


    function updateStatistics() {

        let total = students.length;

        document.getElementById("totalStudents")
            .innerText = total;


        if (total === 0) {

            document.getElementById("averageMarks")
                .innerText = "0";

            document.getElementById("topMarks")
                .innerText = "0";

            return;

        }


        let totalMarks = students.reduce(
            (sum, student) => sum + student.marks,
            0
        );


        let average = totalMarks / total;


        let top = Math.max(
            ...students.map(student => student.marks)
        );


        document.getElementById("averageMarks")
            .innerText = average.toFixed(1);


        document.getElementById("topMarks")
            .innerText = top;

    }


    function clearForm() {

        document.getElementById("studentId").value = "";
        document.getElementById("studentName").value = "";
        document.getElementById("studentAge").value = "";
        document.getElementById("studentCourse").value = "";
        document.getElementById("studentMarks").value = "";

    }


    displayStudents();

</script>

</body>
</html>
